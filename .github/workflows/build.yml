name: Rust checks and builds

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_path: target/release/nchu-diary-autofill.exe
            asset_name: NCHU_Diary_AutoFill-windows.exe
            headless_path: target/release/nchu-diary-headless.exe
            headless_asset_name: NCHU_Diary_Headless-windows.exe
          - os: macos-latest
            build_path: target/release/nchu-diary-autofill
            asset_name: NCHU_Diary_AutoFill-macos
            headless_path: target/release/nchu-diary-headless
            headless_asset_name: NCHU_Diary_Headless-macos
          - os: ubuntu-latest
            build_path: target/release/nchu-diary-autofill
            asset_name: NCHU_Diary_AutoFill-linux
            headless_path: target/release/nchu-diary-headless
            headless_asset_name: NCHU_Diary_Headless-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux GUI and TLS dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev fonts-noto-cjk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Local browser integration
        if: runner.os == 'Linux'
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          NCHU_TEST_BROWSER: Chrome
        run: cargo test --locked --test browser_flow -- --ignored

      - name: Build executable
        run: cargo build --release --locked --bins

      - name: Rename build output
        shell: bash
        run: |
          cp "${{ matrix.build_path }}" "${{ matrix.asset_name }}"
          cp "${{ matrix.headless_path }}" "${{ matrix.headless_asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.headless_asset_name }}
            LICENSE
            THIRD_PARTY_NOTICES.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NCHU_Diary_AutoFill-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/NCHU_Diary_*
            LICENSE
            THIRD_PARTY_NOTICES.md
