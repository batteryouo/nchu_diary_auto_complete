[package]
name = "nchu-diary-autofill"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Native desktop automator for NCHU learning logs"
license = "MIT"
default-run = "nchu-diary-autofill"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "system_fonts", "clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thirtyfour = { version = "0.38.1", default-features = false, features = ["reqwest", "native-tls", "manager"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
